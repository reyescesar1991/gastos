<section class="dashboard">
  <header class="dashboard__intro">
    <h1 class="dashboard__title">Resumen</h1>
    <p class="dashboard__subtitle">
      Tus ingresos, egresos y disponible del periodo, con lo último que registraste.
    </p>
  </header>

  <app-balance-summary [balance]="balanceStore.balance()" />

  <app-quick-nav />

  <app-movements-list
    [movements]="movementsStore.latestMovements()"
    [hasMovements]="movementsStore.hasMovements()"
    [isLoading]="movementsStore.isLoading()"
  />

  <section class="quick-action" aria-label="Acceso rápido">
    <button
      class="quick-action__button"
      type="button"
      [disabled]="!canAddMovement()"
      (click)="onAddMovement()"
    >
      <app-icon name="plus" size="sm" />
      <span>Registrar movimiento</span>
      @if (!canAddMovement()) {
        <span class="quick-action__state">Próximamente</span>
      }
    </button>
  </section>
</section>
